services:
  postgres:
    image: postgres:16
    container_name: study-tracker-db
    restart: always
    environment:
      POSTGRES_USER: study_user
      POSTGRES_PASSWORD: study_password
      POSTGRES_DB: study_tracker
    ports:
      - '5432:5432'
    volumes:
      - study_tracker_data:/var/lib/postgresql/data

volumes:
  study_tracker_data:
